name: WRTS Web App CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/eventos-plv]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Validate production build
        run: npm run check
